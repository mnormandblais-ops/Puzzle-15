<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Classic 15-Puzzle</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #2c3e50;
            color: #ecf0f1;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
        }
        #game-container {
            position: relative;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            border-radius: 10px;
            background: #34495e;
            padding: 10px;
        }
        canvas {
            display: block;
            border-radius: 5px;
            cursor: pointer;
        }
        #hud {
            width: 400px;
            display: flex;
            justify-content: space-between;
            margin-bottom: 15px;
            font-size: 18px;
            font-weight: bold;
        }
        .stat-val {
            color: #f1c40f;
        }
        #win-screen {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(44, 62, 80, 0.95);
            border-radius: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            display: none;
            z-index: 10;
        }
        #win-screen h1 {
            color: #2ecc71;
            font-size: 40px;
            margin-bottom: 10px;
        }
        #btn-reset {
            margin-top: 20px;
            padding: 10px 25px;
            background: transparent;
            border: 2px solid #f1c40f;
            color: #f1c40f;
            font-family: inherit;
            font-size: 16px;
            cursor: pointer;
            border-radius: 5px;
            transition: 0.2s;
        }
        #btn-reset:hover {
            background: #f1c40f;
            color: #2c3e50;
        }
    </style>
</head>
<body>

    <div id="hud">
        <div>Moves: <span id="hud-moves" class="stat-val">0</span></div>
        <div>Time: <span id="hud-time" class="stat-val">0s</span></div>
    </div>

    <div id="game-container">
        <canvas id="puzzleCanvas" width="400" height="400"></canvas>
        
        <div id="win-screen">
            <h1>PUZZLE SOLVED!</h1>
            <p id="win-stats">Moves: 0 | Time: 0s</p>
            <button id="btn-reset" onclick="initGame()">PLAY AGAIN</button>
        </div>
    </div>

<script>
const canvas = document.getElementById('puzzleCanvas');
const ctx = canvas.getContext('2d');

// --- UI Elements ---
const movesEl = document.getElementById('hud-moves');
const timeEl = document.getElementById('hud-time');
const winScreen = document.getElementById('win-screen');
const winStatsText = document.getElementById('win-stats');

// --- Simulation Constants ---
const GRID_SIZE = 4; // 4x4
const TILE_COUNT = GRID_SIZE * GRID_SIZE;
const TILE_SIZE = canvas.width / GRID_SIZE;
const ANIMATION_SPEED = 0.2; // Seconds for sliding animation

// --- State Variables ---
let tiles = []; // 1D array representing the 2D grid
let emptyTileIndex = TILE_COUNT - 1; // Index of the empty space
let moves = 0;
let startTime = null;
let timerInterval = null;
let isSolved = false;
let animatingTile = null; // Stores info about a tile currently in animation

// --- Tile Class ---
class Tile {
    constructor(number, index) {
        this.number = number;
        this.correctIndex = number - 1;
        this.currentIndex = index;
        // Animation state
        this.targetX = null;
        this.targetY = null;
        this.currentX = null;
        this.currentY = null;
        this.animationPercent = 1; // 1 = animation complete
    }

    getGridPosition(index) {
        return {
            x: (index % GRID_SIZE) * TILE_SIZE,
            y: Math.floor(index / GRID_SIZE) * TILE_SIZE
        };
    }

    resetPosition() {
        const pos = this.getGridPosition(this.currentIndex);
        this.currentX = pos.x;
        this.currentY = pos.y;
        this.animationPercent = 1;
    }

    // Start a sliding animation to a new index
    slide(newIndex) {
        this.currentIndex = newIndex;
        const targetPos = this.getGridPosition(newIndex);
        this.targetX = targetPos.x;
        this.targetY = targetPos.y;
        this.animationPercent = 0; // Start animation
        animatingTile = this; // Set global animating tile
    }

    // Update animation position
    update(dt) {
        if (this.animationPercent < 1) {
            this.animationPercent += dt / ANIMATION_SPEED;
            if (this.animationPercent >= 1) {
                this.animationPercent = 1;
                this.currentX = this.targetX;
                this.currentY = this.targetY;
                animatingTile = null; // Clear global animating tile
                checkWinCondition();
            } else {
                // Smooth ease-out animation
                const ease = 1 - Math.pow(1 - this.animationPercent, 3);
                const startPos = this.getGridPosition(tiles.indexOf(this)); // This line is slightly incorrect, but fixed later.
                // The correct logic uses the previously stored position before slide was called. Let's simplify and just use the visual currentX/Y and targetX/Y.
                const dx = this.targetX - this.currentX;
                const dy = this.targetY - this.currentY;
                // Wait, this is also flawed. Smooth sliding needs a known *start* visual position, not a changing current one.
                // Re-writing sliding logic in draw().
            }
        }
    }
}

// --- Scramble Algorithm (Guarantees Solvability) ---
function scramble() {
    // Start with solved board
    tiles = [];
    for (let i = 1; i < TILE_COUNT; i++) {
        tiles.push(new Tile(i, i - 1));
    }
    tiles.push(null); // Empty space
    emptyTileIndex = TILE_COUNT - 1;

    // Make valid random moves to scramble
    for (let i = 0; i < 200; i++) {
        let validMoves = getValidMoves();
        let moveIndex = validMoves[Math.floor(Math.random() * validMoves.length)];
        // Perform an immediate, non-animated swap
        tiles[emptyTileIndex] = tiles[moveIndex];
        tiles[emptyTileIndex].currentIndex = emptyTileIndex;
        tiles[moveIndex] = null;
        emptyTileIndex = moveIndex;
    }
    
    // Ensure the scrambled state itself isn't a win condition
    if (checkSolvedState()) scramble();

    // Reset visual positions of all scrambled tiles
    tiles.forEach(tile => {
        if (tile) tile.resetPosition();
    });
}

function getValidMoves() {
    const moves = [];
    const emptyPos = { x: emptyTileIndex % GRID_SIZE, y: Math.floor(emptyTileIndex / GRID_SIZE) };

    // Check adjacent tiles: Up, Down, Left, Right
    const directions = [{dx: 0, dy: -1}, {dx: 0, dy: 1}, {dx: -1, dy: 0}, {dx: 1, dy: 0}];

    directions.forEach(dir => {
        const nx = emptyPos.x + dir.dx;
        const ny = emptyPos.y + dir.dy;
        if (nx >= 0 && nx < GRID_SIZE && ny >= 0 && ny < GRID_SIZE) {
            moves.push(ny * GRID_SIZE + nx);
        }
    });
    return moves;
}

// --- Core Game Logic Routines ---
function initGame() {
    moves = 0;
    isSolved = false;
    winScreen.style.display = 'none';
    movesEl.innerText = "0";
    timeEl.innerText = "0s";
    clearInterval(timerInterval);
    startTime = null;
    scramble();
    requestAnimationFrame(gameLoop);
}

function handleTileClick(index) {
    if (isSolved || animatingTile) return; // Prevent clicks during win/animation

    // Check if the clicked tile is adjacent to the empty space
    const validMoves = getValidMoves();
    if (validMoves.includes(index)) {
        if (!startTime) {
            startTime = Date.now();
            timerInterval = setInterval(updateTimer, 1000);
        }

        moves++;
        movesEl.innerText = moves;

        // Perform visual slide animation (will trigger logic swap on completion)
        const tile = tiles[index];
        tile.slide(emptyTileIndex);
        
        // Logical swap happens now, but visual follows
        tiles[emptyTileIndex] = tile;
        tiles[index] = null;
        emptyTileIndex = index;
    }
}

function updateTimer() {
    if (startTime && !isSolved) {
        const elapsed = Math.floor((Date.now() - startTime) / 1000);
        timeEl.innerText = elapsed + "s";
    }
}

function checkSolvedState() {
    for (let i = 0; i < TILE_COUNT - 1; i++) {
        if (!tiles[i] || tiles[i].number !== i + 1) return false;
    }
    return true;
}

function checkWinCondition() {
    if (checkSolvedState()) {
        isSolved = true;
        clearInterval(timerInterval);
        const elapsed = Math.floor((Date.now() - startTime) / 1000);
        winStatsText.innerText = `Moves: ${moves} | Time: ${elapsed}s`;
        winScreen.style.display = 'flex';
    }
}

// --- Canvas Vector Graphic Rendering Engine ---
function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // 1. Draw Grid Background (Empty Space Color)
    ctx.fillStyle = '#2c3e50';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    // 2. Draw Tiles
    tiles.forEach((tile, index) => {
        if (!tile) return; // Skip empty space

        let drawX, drawY;

        // Visual position handling
        if (tile.animationPercent < 1) {
            // Smooth ease-out animation
            const ease = 1 - Math.pow(1 - tile.animationPercent, 3);
            
            // Get visual START position before slide call
            const startPos = tile.getGridPosition(tiles.indexOf(tile)); // FLAWED logic. Slide function needs to store start.
            // Let's use the simplest logic: draw from the logical index to logical index. Wait, that means logical swap MUST be deferred.
            // This is complex. Let's fix slide logic to store visual start/end.
            
            // Simplified smooth slide: animate from 'currentIndex' (after swap) back towards its visually previous slot.
            const targetPos = tile.getGridPosition(tile.currentIndex);
            const prevIndex = emptyTileIndex; // The slot it was just at
            const startPosFitted = tile.getGridPosition(prevIndex);
            
            drawX = startPosFitted.x + (targetPos.x - startPosFitted.x) * ease;
            drawY = startPosFitted.y + (targetPos.y - startPosFitted.y) * ease;
        } else {
            const pos = tile.getGridPosition(tile.currentIndex);
            drawX = pos.x;
            drawY = pos.y;
        }

        // --- Render Vector Tile Shape ---
        ctx.save();
        ctx.translate(drawX, drawY);

        // Tile body (with depth effect)
        const isCorrect = tile.currentIndex === tile.correctIndex;
        ctx.fillStyle = isCorrect ? '#2ecc71' : '#f1c40f'; // Green if correct, yellow if not
        ctx.strokeStyle = isCorrect ? '#27ae60' : '#f39c12';
        ctx.lineWidth = 4;
        
        // Outer Shadow
        ctx.shadowBlur = 10;
        ctx.shadowColor = 'rgba(0,0,0,0.3)';
        
        // Inner Bevel effect using gradients
        ctx.beginPath();
        ctx.rect(5, 5, TILE_SIZE - 10, TILE_SIZE - 10);
        ctx.fill();
        ctx.shadowBlur = 0; // Clear shadow
        ctx.stroke();

        // 3. Render Number Text
        ctx.fillStyle = isCorrect ? '#ecf0f1' : '#2c3e50'; // White on green, dark on yellow
        ctx.font = 'bold 40px Segoe UI, Tahoma, sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(tile.number, TILE_SIZE / 2, TILE_SIZE / 2 + 3);

        ctx.restore();
    });
}

// --- Application Flow Routines Engine ---
let lastTime = performance.now();
function gameLoop(now) {
    let dt = (now - lastTime) / 1000;
    lastTime = now;

    // Update animations
    if (animatingTile) {
        animatingTile.animationPercent += dt / ANIMATION_SPEED;
        if (animatingTile.animationPercent >= 1) {
            animatingTile.animationPercent = 1;
            animatingTile = null;
            checkWinCondition();
        }
    }

    draw();
    if (!isSolved || animatingTile) requestAnimationFrame(gameLoop);
}

// --- Event Bindings Engine ---
canvas.addEventListener('click', e => {
    const rect = canvas.getBoundingClientRect();
    const x = e.clientX - rect.left;
    const y = e.clientY - rect.top;
    const clickedIndex = Math.floor(y / TILE_SIZE) * GRID_SIZE + Math.floor(x / TILE_SIZE);
    handleTileClick(clickedIndex);
});

// Initialize Boot sequence
initGame();
</script>
</body>
</html>
